name: HoursGram Desktop Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build HoursGram.exe (x64 Release)
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: 10.0.26100.0
          toolset: '14.44'

      - name: Prepare dependency directories
        shell: pwsh
        run: |
          $dependencyRoot = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '..'))
          New-Item -ItemType Directory -Force -Path (Join-Path $dependencyRoot 'ThirdParty'), (Join-Path $dependencyRoot 'Libraries\win64') | Out-Null

      - name: Restore third-party build tools
        id: third-party-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/../ThirdParty
          key: ${{ runner.os }}-hoursgram-x64-third-party-v3-restore
          restore-keys: |
            ${{ runner.os }}-hoursgram-x64-third-party-v3-

      - name: Restore native libraries
        id: native-libraries-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/../Libraries/win64
          key: ${{ runner.os }}-hoursgram-x64-libraries-v3-restore
          restore-keys: |
            ${{ runner.os }}-hoursgram-x64-libraries-v3-

      - name: Configure NuGet sources
        shell: cmd
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages" >nul 2>&1
          nuget sources Add -Source https://api.nuget.org/v3/index.json >nul 2>&1
          exit /b 0

      - name: Prepare native dependencies
        id: prepare-dependencies
        shell: cmd
        run: Telegram\build\prepare\win.bat silent

      - name: Fingerprint prepared dependency state
        id: dependency-cache-key
        if: always()
        shell: pwsh
        run: |
          $cacheRoots = @{
            third_party = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '..\ThirdParty\cache_keys'))
            libraries = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '..\Libraries\win64\cache_keys'))
          }

          foreach ($name in $cacheRoots.Keys) {
            $cacheRoot = $cacheRoots[$name]
            $files = @()
            if (Test-Path -LiteralPath $cacheRoot) {
              $files = @(Get-ChildItem -LiteralPath $cacheRoot -File -Recurse | Sort-Object FullName)
            }

            $fingerprint = 'empty'
            if ($files.Count -gt 0) {
              $manifest = foreach ($file in $files) {
                $relativePath = [System.IO.Path]::GetRelativePath($cacheRoot, $file.FullName).Replace('\', '/')
                "$relativePath=$([System.IO.File]::ReadAllText($file.FullName))"
              }
              $manifestPath = Join-Path $env:RUNNER_TEMP "hoursgram-$name-cache-manifest.txt"
              [System.IO.File]::WriteAllText($manifestPath, (($manifest -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))
              $fingerprint = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
            }

            "${name}_hash=$fingerprint" >> $env:GITHUB_OUTPUT
            "${name}_count=$($files.Count)" >> $env:GITHUB_OUTPUT
          }

      - name: Save third-party build tools
        if: always() && steps.dependency-cache-key.outcome == 'success' && steps.dependency-cache-key.outputs.third_party_count != '0'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/../ThirdParty
          key: ${{ runner.os }}-hoursgram-x64-third-party-v3-${{ steps.dependency-cache-key.outputs.third_party_hash }}

      - name: Save native libraries
        if: always() && steps.dependency-cache-key.outcome == 'success' && steps.dependency-cache-key.outputs.libraries_count != '0'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/../Libraries/win64
          key: ${{ runner.os }}-hoursgram-x64-libraries-v3-${{ steps.dependency-cache-key.outputs.libraries_hash }}

      - name: Configure HoursGram
        shell: cmd
        working-directory: Telegram
        run: configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build HoursGram
        shell: cmd
        run: cmake --build out --config Release --target Telegram --parallel 4 -- /p:UseStructuredOutput=false

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: HoursGram-Windows-x64
          path: out/Release/
          if-no-files-found: error
          retention-days: 7
